name: Security Scan (SAST, DAST, Dependency Scan)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Dependency Vulnerability Scan & SAST
  # -------------------------------------------------------------
  sast-and-dependency-scan:
    name: Dependency Scan & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Dependency Scan (Trivy)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      # 2. Static Application Security Testing (Semgrep SAST)
      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep semgrep \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --error

  # -------------------------------------------------------------
  # Build Container & DAST
  # -------------------------------------------------------------
  dast-scan:
    name: Build & DAST Scan
    runs-on: ubuntu-latest
    needs: sast-and-dependency-scan
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: credvault
          POSTGRES_PASSWORD: credvault
          POSTGRES_DB: credvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credvault -d credvault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Container Image
        run: docker build -t credvault:local .

      # Start container locally
      - name: Start Application
        run: |
          docker run -d --name credvault-app \
            --network host \
            -e DATABASE_URL="postgresql://credvault:credvault@127.0.0.1:5432/credvault" \
            -e AUTH_SECRET="ci_test_secret_key_123456" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            credvault:local
          sleep 10

      # 3. Dynamic Application Security Testing (OWASP ZAP)
      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false