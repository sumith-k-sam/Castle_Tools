
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credvault
  labels:
    app: credvault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credvault
  template:
    metadata:
      labels:
        app: credvault
    spec:
      containers:
        - name: credvault
          image: 457660516559.dkr.ecr.us-east-1.amazonaws.com/credvault:6
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
